aid: agencykpi
name: AgencyKPI
description: 'AgencyKPI, Inc. was an Austin, Texas insurtech founded in 2017 by Trent
  Richmond and Bobby Billman, building a business intelligence and benchmarking platform
  for the independent insurance distribution channel — agency networks, independent
  agencies, carriers and wholesalers. The platform (marketed as Harmony) ingested,
  cleaned and normalized policy, premium and commission data out of agency management
  systems and carrier feeds, then presented benchmarking, collaborative planning and
  operational reporting on top of it, plus a managed insurance data lake for customer
  data teams. The company raised a Series A in 2020 from insurance industry investors
  and a Series B in 2022 that included Live Oak Ventures. As of 2026 AgencyKPI has
  ceased operations: agencykpi.com serves only a single-page service notice stating
  the platform has been discontinued effective immediately, and no developer, documentation
  or API surface remains reachable.'
